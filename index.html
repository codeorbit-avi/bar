<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Happy Birthday 🎂</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<button id="themeToggle">🌙</button>

<!-- Floating Balloons -->
<div class="balloons"></div>

<!-- Hero -->
<section class="hero">
  <h1 id="typingText">🎉 Happy Birthday Manci 🎂</h1>
  <p>Wishing you a day full of joy, cake, and magic ✨</p>
  <button class="cta" id="celebrateBtn">Celebrate Now 🎈</button>
</section>

<!-- Message Section -->
<section class="glass card">
  <h2>💌 Special Wishes</h2>
  <p>
    May your life be filled with laughter, success, and endless happiness 🥳🎁
  </p>
</section>

<!-- Music -->
<div class="music-player">
  🎵
  <audio id="music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
  </audio>
</div>

<!-- Surprise -->
<section class="glass card">
  <button id="surpriseBtn" class="surprise">🎁 Surprise!</button>
</section>

<footer>
  Made with ❤️ for Manic
</footer>

<script src="script.js"></script>
</body>
</html>
